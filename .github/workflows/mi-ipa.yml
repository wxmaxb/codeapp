name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./downloadFrameworks.sh
      - run: xcodebuild -project Code.xcodeproj -scheme Code -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r CodeApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CodeApp-ipa
          path: CodeApp.ipa